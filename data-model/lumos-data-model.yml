id_conventions:
  format: uuid
  note: >-
    Lumos uses opaque UUIDs, not prefixed ids. The one convention worth knowing is the app_class_id /
    instance_id pair: app_class_id identifies the INTEGRATION TYPE from the catalogue, instance_id the
    tenant's connected instance. Passing one where the other is expected is the most common 404 in
    this contract, and the 404 description says so ("no integration with this `app_class_id` is
    available to your domain").
  external_id: >-
    ActivityRecordAccountInput carries `external_id` and BaseGroup carries `integration_specific_id` —
    both are the third-party system's identifier, not a Lumos one.
