description: >-
  The Lumos entity graph, derived from component schemas that carry an `id` and from the *_id
  reference fields that link them. The spine is App -> Account -> User: Lumos discovers apps, pulls
  accounts out of them, and reconciles those accounts to identities. Everything else — AppStore
  requestable permissions, access requests, pre-approval rules, access policies, access reviews,
  tasks — hangs off that spine.
