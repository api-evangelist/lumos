domain_standards:
- id: scim2
  name: SCIM 2.0 (RFC 7643 / 7644)
  conforms: true
  evidence_level: docs
  reward_only: true
  evidence:
    url: https://developers.lumos.com/docs/scim-1
    detail: >-
      Lumos documents a SCIM connector — "Standards-based identity synchronization framework
      supporting automated access provisioning across SCIM 2.0-compatible systems" — and maintains a
      dated SCIM connector changelog. IMPORTANT SCOPE NOTE: this is Lumos acting as a SCIM CLIENT
      against customer systems. The api.lumos.com contract itself declares NO SCIM schema URNs, no
      /Users or /Groups SCIM resource paths and no ServiceProviderConfig, so Lumos does not expose a
      SCIM server surface of its own. Recorded as a documented capability, not as a contract-level
      declaration.
  contract_declaration: false
identity_governance_note: >-
  Identity governance and administration has no single machine-readable interop standard the way
  banking has FDX or telecom has CAMARA. SCIM 2.0 covers provisioning only, and Lumos consumes it
  rather than serving it. No conformance was invented to fill the domain-standard slot.
