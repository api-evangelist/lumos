          maxLength: 511
          title: Request Instructions
          description: The updated request instructions.
        app_class_id:
          anyOf:
          - type: string
          - type: 'null'
          title: App Class Id
          description: Canonical identifier of the integration this app belongs to, e.g. `okta.com`. Must match the existing app (a mismatch is rejected with 400); required when rotating credentials via `auth`/`settings`/`version`.
        auth:
          anyOf:
          - type: object
          - type: 'null'
          title: Auth
          description: 'New credentials for the integration, as a JSON object — **all secrets go here**. Providing credentials reconnects the app: they are always overwritten and re-validated, and a sync is triggered. The accepted keys depend on the integration and are validated server-side. Missing or wrong-shaped credentials are rejected with 400; credentials the third party rejects return 502. Requires `app_class_id`.'
        settings:
          anyOf:
          - type: object
          - type: 'null'
          title: Settings
          description: Non-secret configuration for the integration being reconnected, as a JSON object — e.g. host, port, region, or tenant / instance URL. The accepted keys vary by integration and some integrations need none. Requires `app_class_id`.
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          description: Optional integration version override for the reconnect. Pins the connection to a specific integration implementation/version instead of the current default; leave unset (`null`) unless directed otherwise. Requires `app_class_id`.
      additionalProperties: false
      type: object
      title: AppInputPut
      description: 'Body of `PUT /apps/{app_id}`: update metadata overrides and/or reconnect.


        One flat model serves both operations (mirroring `AppInputCreate`): the

        metadata fields apply the same domain-specific overrides as

        `PATCH /apps/{app_id}`, and providing credentials (`auth`/`settings`/

        `version`, which require the matching `app_class_id`) additionally

        reconnects the integration with those credentials.'
      examples:
      - description: Hand-rolled deploy dashboard.
        name: My internal tool
      - app_class_id: okta.com
        auth:
          api_key: 0123456789abcdef0123456789abcdef
        settings:
          app_instance_identifier: myorg.okta.com
