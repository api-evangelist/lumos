        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search for users by name or email.
          title: Search Term
        description: Search for users by name or email.
      - name: exact_match
        in: query
        required: false
        schema:
          type: boolean
          description: If a search_term is provided, only accept exact matches.
          default: false
          title: Exact Match
        description: If a search_term is provided, only accept exact matches.
      - name: expand
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Fields to expand. Supported fields: custom_attributes.'
          title: Expand
        description: 'Fields to expand. Supported fields: custom_attributes.'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UserWithCustomAttributes_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
