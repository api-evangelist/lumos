openapi: 3.2.0
info:
  title: Lumos Core API
  description: 'The Lumos API gives you the building blocks to administer and extend Lumos programmatically.

    Our REST API provides a management interface for the AppStore and a read interface

    for the Lumos Core.

    Go to https://developers.lumos.com to see our complete documentation.'
  version: 0.1.0
servers:
- url: https://api.lumos.com
tags:
- name: Core
paths:
  /apps:
    get:
      tags:
      - Core
      summary: Get Apps
      description: List all of your company's apps.
      operationId: listApps
      security:
      - HTTPBearer: []
      parameters:
      - name: name_search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search against name, app instance identifier, and app class ID.
          title: Name Search
        description: Search against name, app instance identifier, and app class ID.
      - name: exact_match
        in: query
        required: false
        schema:
          type: boolean
          description: Search filter should be an exact match.
          default: false
          title: Exact Match
        description: Search filter should be an exact match.
      - name: connection_source
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ConnectionSource'
          - type: 'null'
          description: Filter to integration apps connected via this source (`API` or `UI`).
          title: Connection Source
        description: Filter to integration apps connected via this source (`API` or `UI`).
      - name: disconnected
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter on whether the app has been disconnected. `false` excludes disconnected apps, `true` returns only disconnected apps whose record Lumos still holds, and omitting it lists every app. Pair `false` with `connection_source=API` to reconcile the integrations you manage from automation such as Terraform.
          title: Disconnected
        description: Filter on whether the app has been disconnected. `false` excludes disconnected apps, `true` returns only disconnected apps whose record Lumos still holds, and omitting it lists every app. Pair `false` with `connection_source=API` to reconcile the integrations you manage from automation such as Terraform.
      - name: expand
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Fields to expand. Supported fields: custom_attributes.'
          title: Expand
        description: 'Fields to expand. Supported fields: custom_attributes.'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_AppWithCustomAttributes_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Core
      summary: Create App
      description: 'Create a new custom app, or connect an integration app.


        With a `name`/`category`/`description` body this creates a custom app. With an `app_class_id` body it connects the integration identified by `app_class_id` using the credentials in `auth` — integrations that validate in-band connect immediately and trigger an initial sync, while integrations that require browser consent are finished in the Lumos UI. Custom apps and integrations created here are both marked `connection_source=API`; list your API-managed apps with `GET /apps?connection_source=API&disconnected=false`.'
      operationId: createApp
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInputCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          description: 'Bad request — the request could not be processed. Common causes: missing or malformed credentials, an unknown `app_class_id`, or an invalid configuration value. See the `detail` field for the specific reason.'
        '403':
          description: Forbidden — the caller lacks permission to manage apps on this domain.
        '501':
          description: Not implemented — this app does not support the requested operation.
        '404':
          description: Not found — no integration with this `app_class_id` is available to your domain.
        '409':
          description: Conflict — an instance for this app already exists in the domain.
        '502':
          description: Bad gateway — the third-party service rejected the credentials, or the post-connect sync failed.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apps/categories:
    get:
      tags:
      - Core
      summary: Get App Categories
      description: Get app categories.
      operationId: getAppCategories
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Getappcategories
      security:
      - HTTPBearer: []
  /apps/{app_id}:
    get:
      tags:
      - Core
      summary: Get App
      description: Get an app by id.
      operationId: getApp
      security:
      - HTTPBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      - name: expand
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Fields to expand. Supported fields: custom_attributes.'
          title: Expand
        description: 'Fields to expand. Supported fields: custom_attributes.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppWithCustomAttributes'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Core
      summary: Update App
      description: Update domain-specific app metadata overrides. This updates the app instance in your domain, not the shared Lumos app catalog.
      operationId: updateApp
      security:
      - HTTPBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInputUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Core
      summary: Reconnect App
      description: 'Update an app in place: apply domain-specific metadata overrides (the same fields as `PATCH /apps/{app_id}`) and/or rotate an integration''s credentials. Providing `auth`/`settings`/`version` (with the matching `app_class_id`) reconnects the app: credentials are always overwritten and re-validated, and a sync is triggered — like connect, the app either connects in-band or awaits browser consent in the Lumos UI, and while a sync is in flight the request is throttled with `429` and a `Retry-After` header. Metadata-only bodies (custom apps, or integrations without credential changes) never touch credentials.'
      operationId: reconnectApp
      security:
      - HTTPBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInputPut'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          description: 'Bad request — the request could not be processed. Common causes: missing or malformed credentials, an unknown `app_class_id`, or an invalid configuration value. See the `detail` field for the specific reason.'
        '403':
          description: Forbidden — the caller lacks permission to manage apps on this domain.
        '501':
          description: Not implemented — this app does not support the requested operation.
        '404':
          description: Not found — no app with this id in your domain.
        '409':
          description: Conflict — credentials were provided for an app that is not managed via the API (`connection_source` is not `API`), so it cannot be reconnected here.
        '429':
          description: Too many requests — a sync is already in flight for this app. Includes a `Retry-After` header (seconds).
        '502':
          description: Bad gateway — the third-party service rejected the credentials, or the post-reconnect sync failed.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Core
      summary: Disconnect App
      description: Disconnect an API-managed app. For integrations this removes the stored credentials and returns the app to a connectable state; for custom apps it removes the app. In both cases, when no users remain the underlying record is also deleted where possible (a record still referenced by other Lumos data is kept, disconnected). Reconnect an integration later with `PUT /apps/{app_id}`. Returns 404 if `app_id` is unknown in the caller's organization.
      operationId: disconnectApp
      security:
      - HTTPBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisconnectIntegrationOutput'
        '400':
          description: 'Bad request — the request could not be processed. Common causes: missing or malformed credentials, an unknown `app_class_id`, or an invalid configuration value. See the `detail` field for the specific reason.'
        '403':
          description: Forbidden — the caller lacks permission to manage apps on this domain.
        '501':
          description: Not implemented — this app does not support the requested operation.
        '404':
          description: Not found — no app with this id in your domain.
        '409':
          description: Conflict — the app is not managed via the API (`connection_source` is not `API`), so it cannot be disconnected here.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
