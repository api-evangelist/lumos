        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          description: 'The category of the app you''re creating; required when creating a custom app. Possible values: ''Accounting & Finance'', ''Marketing & Analytics'', ''Content & Social Media'', ''Sales & Support'', ''Design & Creativity'', ''IT & Security'', ''Developers'', ''HR & Learning'', ''Office & Legal'', ''Communication'', ''Collaboration'', ''Commerce & Marketplaces'', ''Other'', ''Internal'''
        description:
          anyOf:
          - type: string
            maxLength: 8192
          - type: 'null'
          title: Description
          description: The description of the app you're creating. Required when creating a custom app.
        logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Url
          description: The URL of the logo of the app you're creating.
        website_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Website Url
          description: The URL of the website of the app you're creating.
        request_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Instructions
          description: The request instructions.
        app_class_id:
          anyOf:
          - type: string
          - type: 'null'
          title: App Class Id
          description: Canonical identifier of an integration to connect, e.g. `okta.com`. Providing it switches this request from creating a custom app to connecting that integration using `auth`/`settings`. Must be an integration Lumos supports for your domain; an unknown value is rejected with 400.
        auth:
          anyOf:
          - type: object
          - type: 'null'
          title: Auth
          description: Credentials for the integration being connected, as a JSON object — **all secrets go here**. The accepted keys depend on the integration and are validated server-side. Some integrations connect in-band from these credentials (e.g. an `api_key`, or an OAuth `client_id`/`client_secret`); others require browser consent and are finished in the Lumos UI — for those, send `{}`. Missing or wrong-shaped credentials are rejected with 400; credentials the third party rejects return 502. Only used with `app_class_id`.
        settings:
          anyOf:
          - type: object
          - type: 'null'
          title: Settings
          description: Non-secret configuration for the integration being connected, as a JSON object — e.g. host, port, region, or tenant / instance URL. The accepted keys vary by integration and some integrations need none. Only used with `app_class_id`.
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          description: Optional integration version override. Pins the connection to a specific integration implementation/version instead of the current default; leave unset (`null`) unless directed otherwise. Only used with `app_class_id`.
      type: object
      title: AppInputCreate
      description: 'Body of `POST /apps`: create a custom app, or connect an integration.


        One flat model serves both operations (a request-body union would generate

        poorly into SDK/Terraform clients). Providing `app_class_id` switches the

        request from "create a custom app" to "connect an integration"; the model

        validator enforces the fields each mode requires.'
      examples:
      - category: Engineering
        description: Hand-rolled deploy dashboard.
        name: My internal tool
      - app_class_id: okta.com
        auth:
          api_key: 0123456789abcdef0123456789abcdef
        settings:
          app_instance_identifier: myorg.okta.com
