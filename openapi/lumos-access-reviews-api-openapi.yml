        byyearday:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Byyearday
          description: Days of the year to recur on.
        byweekno:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Byweekno
          description: Week numbers of the year to recur on.
        bysetpos:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Bysetpos
          description: Positions within the recurrence set to include (e.g. -1 for last occurrence, 1 for first).
        byhour:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Byhour
          description: Hours of the day to recur on (0–23).
        byminute:
          anyOf:
          - items:
              type: integer
            type: array
