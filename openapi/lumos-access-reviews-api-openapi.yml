    DatetimeScopeFilterInput:
      properties:
        group:
          type: string
          enum:
          - LAST_LOGIN
          - LAST_ACTIVITY
          title: Group
          description: Datetime scope filter group. Must be LAST_LOGIN or LAST_ACTIVITY.
        after:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: After
          description: Inclusive lower bound. Records where the datetime field is >= this value match.
        before:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
          description: Inclusive upper bound. Records where the datetime field is <= this value match.
      additionalProperties: false
      type: object
      required:
      - group
      title: DatetimeScopeFilterInput
      description: "Scope filter for datetime-valued groups (``LAST_LOGIN``, ``LAST_ACTIVITY``).\n\nProvide ``after``, ``before``, or both. Bounds are inclusive. At least one\nmust be set.\n\n- ``after`` alone: matches records where the field is on or after that timestamp.\n- ``before`` alone: matches records where the field is on or before that timestamp.\n- Both: matches records in the closed interval ``[after, before]``. If the\n  two bounds are equal, this matches records at exactly that timestamp."
    AddAppsOutput:
