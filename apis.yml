  name: Lumos REST API
  description: >-
    The Lumos REST API enables programmatic access to the Lumos identity platform for automating tasks
    such as managing users, apps, access requests, and governance workflows. All requests require a bearer
    token (prefixed lsk_) in the Authorization header.
  humanURL: https://developers.lumos.com/docs/rest-api
